name: livingreadme-local
services:
  mongo:
    image: mongo:8
    container_name: livingreadme-mongo
    restart: unless-stopped
    networks:
      - livingreadme-local-network
    ports:
      - "27017:27017"
    volumes:
      - livingreadme-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: livingreadme-redis
    restart: unless-stopped
    networks:
      - livingreadme-local-network
    ports:
      - "6379:6379"
    volumes:
      - livingreadme-redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livingreadme-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    networks:
      - livingreadme-local-network
    ports:
      - "3000:3000"

networks:
  livingreadme-local-network:
    name: livingreadme-local-network
    driver: bridge

volumes:
  livingreadme-mongo-data:
    name: livingreadme-mongo-data
  livingreadme-redis-data:
    name: livingreadme-redis-data
