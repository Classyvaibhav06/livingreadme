name: livingreadme-api-server
services:
  redis:
    image: redis:7-alpine
    container_name: livingreadme-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - livingreadme-api-network
    volumes:
      - livingreadme-redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
    depends_on:
      - redis
    networks:
      - livingreadme-api-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - livingreadme-api-network

networks:
  livingreadme-api-network:
    name: livingreadme-api-network
    driver: bridge

volumes:
  livingreadme-redis-data:
    name: livingreadme-redis-data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
